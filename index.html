<title>GRC Grind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDF0EE; --surface:#FFFFFF; --surface-2:#F4F7F5; --paper:#FBFAF7;
  --ink:#141B19; --ink-2:#4E5C57; --ink-3:#7C8A85;
  --line:#D2DAD6; --line-2:#B7C3BE;
  --accent:#0E5A47; --accent-ink:#0E5A47; --accent-soft:#DAE8E2;
  --stamp:#A02B24; --stamp-ink:#A02B24; --stamp-soft:#F4DFDD;
  --amber:#8E6210; --amber-soft:#F3E6C9;
  --sky:#1E5E7C; --sky-soft:#DBE8EE;
  --shadow:0 1px 2px rgba(20,27,25,.05), 0 10px 26px -16px rgba(20,27,25,.35);
  --shadow-lift:0 2px 4px rgba(20,27,25,.06), 0 18px 40px -20px rgba(20,27,25,.42);
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0F1513; --surface:#17201D; --surface-2:#1D2724; --paper:#1A2320;
  --ink:#E7EEEA; --ink-2:#A2B1AB; --ink-3:#76847E;
  --line:#293733; --line-2:#3A4A45;
  --accent:#54C4A2; --accent-ink:#7BD6BA; --accent-soft:#16352D;
  --stamp:#E8877F; --stamp-ink:#F0A29B; --stamp-soft:#38201E;
  --amber:#D9AC58; --amber-soft:#382D16;
  --sky:#84BCD6; --sky-soft:#152F3B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0F1513; --surface:#17201D; --surface-2:#1D2724; --paper:#1A2320;
  --ink:#E7EEEA; --ink-2:#A2B1AB; --ink-3:#76847E;
  --line:#293733; --line-2:#3A4A45;
  --accent:#54C4A2; --accent-ink:#7BD6BA; --accent-soft:#16352D;
  --stamp:#E8877F; --stamp-ink:#F0A29B; --stamp-soft:#38201E;
  --amber:#D9AC58; --amber-soft:#382D16;
  --sky:#84BCD6; --sky-soft:#152F3B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-0.01em}
p{margin:0 0 .75em}
p:last-child{margin-bottom:0}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:266px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow-y:auto}
.main{min-width:0;padding:22px 24px 72px;display:flex;flex-direction:column;gap:18px}
.main-inner{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (max-width:880px){
  .rail-deep{display:none}
  .app{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .main{padding:18px 16px 64px}
}

/* ---------- rail bits ---------- */
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em}
.railcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:11px 12px}
.railcard .k{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:3px}
.railcard .v{font-size:14px;font-weight:600;line-height:1.3}
.railcard .sub{font-size:12px;color:var(--ink-2);margin-top:3px}
.railhead{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.skillrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:4px 0;font-size:12.5px}
.skillrow .nm{color:var(--ink-2)}
.skillrow .lv{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase}
.bar{grid-column:1/-1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.navlist{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:var(--r);cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px 20px}
@media (max-width:880px){.pad{padding:15px 16px}}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.rule{height:1px;background:var(--line);border:0;margin:0}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}
.mono{font-family:var(--mono)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:9px 15px;border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:500;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#07130F}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.btn.small{padding:6px 11px;font-size:12.5px}

.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.pill.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.pill.bad{background:var(--stamp-soft);border-color:transparent;color:var(--stamp-ink)}
.pill.info{background:var(--sky-soft);border-color:transparent;color:var(--sky)}

textarea,input[type=text],select{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 11px;resize:vertical}
textarea{min-height:110px;line-height:1.55}
textarea::placeholder{color:var(--ink-3)}
label.field{display:block}
label.field>.lb{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13px;font-weight:600;margin-bottom:5px}
label.field>.lb .hint{font-weight:400;font-size:12px;color:var(--ink-3)}

/* ---------- in-fiction artefact sheets ---------- */
.sheet{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.sheet-hd{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.sheet-hd .t{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sheet-bd{padding:15px 17px;font-family:var(--serif);font-size:16px;line-height:1.62}
@media (max-width:880px){.sheet-bd{padding:13px 14px;font-size:15.5px}}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-family:var(--sans);font-size:12.5px;padding-bottom:10px;margin-bottom:11px;border-bottom:1px solid var(--line)}
.meta dt{color:var(--ink-3);font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding-top:2px}
.meta dd{margin:0;color:var(--ink)}
.msg + .msg{margin-top:13px;padding-top:13px;border-top:1px dashed var(--line-2)}
.msg .who{font-family:var(--sans);font-size:12.5px;font-weight:600;margin-bottom:2px}
.msg .when{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:6px}
.quoted{border-left:2px solid var(--line-2);padding-left:11px;color:var(--ink-2);font-style:italic}
.sheet table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13px;font-variant-numeric:tabular-nums}
.sheet table th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:6px 9px;border-bottom:1px solid var(--line-2)}
.sheet table td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
.sheet table tr:last-child td{border-bottom:0}
.scroller{overflow-x:auto}
.qa{margin:0}
.qa dt{font-family:var(--sans);font-size:13px;font-weight:600;margin-top:11px}
.qa dt:first-child{margin-top:0}
.qa dd{margin:3px 0 0;padding-left:13px;border-left:2px solid var(--accent-soft)}

/* ---------- triage ---------- */
.inbox{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.item .ord{width:29px;height:29px;flex:none;border-radius:999px;border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink-3)}
.item.picked .ord{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.item .src{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.item .sj{font-weight:600;font-size:14px;line-height:1.35;margin:1px 0 2px}
.item .pv{font-size:12.5px;color:var(--ink-2)}
.item button.pick{align-self:center}

/* ---------- grading ---------- */
.review{border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:var(--r);background:var(--surface);overflow:hidden}
.review.flagged{border-left-color:var(--stamp)}
.dims{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
@media (max-width:620px){.dims{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dim{background:var(--surface-2);padding:10px 12px}
.dim .dn{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.dim .dv{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:1px}
.dim .dv small{font-size:12px;font-weight:500;color:var(--ink-3)}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:100%;height:3px;border-radius:2px;background:var(--line-2)}
.dots i.on{background:var(--accent)}
.dots.low i.on{background:var(--stamp)}
.dots.mid i.on{background:var(--amber)}
.fb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fb-list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.5}
.fb-list li .mk{font-family:var(--mono);font-size:11px;font-weight:600;line-height:1.55}
.fb-list li.hit .mk{color:var(--accent-ink)}
.fb-list li.miss .mk{color:var(--stamp-ink)}
.npcline{font-family:var(--serif);font-size:16.5px;line-height:1.6;font-style:italic;color:var(--ink)}
.callout{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:12px 14px;font-size:13.5px;line-height:1.55}
.callout.red{background:var(--stamp-soft);border-color:transparent}
.callout.amberc{background:var(--amber-soft);border-color:transparent}
.callout .ch{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.callout.red .ch{color:var(--stamp-ink)}

/* ---------- misc ---------- */
.beatnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.step{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:3px 0}
.step b{color:var(--ink)}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13.5px}
.spin{width:12px;height:12px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(15,21,19,.55);display:grid;place-items:center;padding:18px;z-index:50;overflow-y:auto}
.modal .card{max-width:640px;width:100%;max-height:calc(100vh - 36px);overflow-y:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.kv dd{margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#07130F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#07130F}}
.scoregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.sbox{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2)}
.sbox .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.hidden{display:none!important}
</style>
<div id="app"></div>
<script>

const BRIGHTPATH = {

    { id:"R-001", title:"Cyber attack", statement:"Cyber attack", l:4, i:5, owner:"Rob Feeney", treatment:"Modify", opened:"2024-11-02", note:"Inherited. One line, no cause, no owner in ELT." },

/* in-game calendar: Tier 1 quarter 1 starts Monday 12 January 2026 */
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function gameDate(tier, quarter, day){
  const base = new Date(Date.UTC(2026,0,12));
  const offset = ((tier-1)*4 + (quarter-1)) * 91 + (day-1) * 1;
  const d = new Date(base.getTime() + offset*86400000);
  while (d.getUTCDay()===0 || d.getUTCDay()===6) d.setUTCDate(d.getUTCDate()+1);
  return d;
}
function fmtDate(d){ return WEEKDAYS[d.getUTCDay()] + " " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear(); }
/* ============================================================
   Artefact renderers — the in-fiction documents.
   ============================================================ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function para(t){ return String(t).split("\n\n").map(p => "<p>"+p.replace(/\n/g,"<br>")+"</p>").join(""); }

function sheet(kind, right, body){
  return `<div class="sheet"><div class="sheet-hd"><span class="t">${esc(kind)}</span>${right?`<span class="t">${esc(right)}</span>`:""}</div><div class="sheet-bd">${body}</div></div>`;
}
function metaBlock(pairs){
  return `<dl class="meta">${pairs.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
}
function email(o){
  return sheet(o.kind||"Email", o.stamp||"", metaBlock([
    ["From", esc(o.from)], ["To", esc(o.to)]
  ].concat(o.cc?[["Cc",esc(o.cc)]]:[]).concat([["Sent", esc(o.sent)],["Subject","<strong>"+esc(o.subject)+"</strong>"]])) + para(o.body));
}
function thread(o){
  const msgs = o.messages.map(m => `<div class="msg"><div class="who">${esc(m.who)}</div><div class="when">${esc(m.when)}</div>${para(m.text)}</div>`).join("");
  return sheet(o.kind||"Email thread", o.stamp||"", metaBlock([["Subject","<strong>"+esc(o.subject)+"</strong>"],["Participants", esc(o.people)]]) + msgs);
}
function chat(o){
  const msgs = o.messages.map(m => `<div class="msg"><div class="who">${esc(m.who)}</div><div class="when">${esc(m.when)}</div>${para(m.text)}</div>`).join("");
  return sheet(o.kind||"Slack — "+(o.channel||"#general"), o.stamp||"", msgs);
}
function tableSheet(kind, right, intro, headers, rows){
  return sheet(kind, right, (intro?para(intro):"") +
    `<div class="scroller"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${
      rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
}
function qaSheet(kind, right, intro, pairs){
  return sheet(kind, right, (intro?para(intro):"") + `<dl class="qa">${pairs.map(([q,a])=>`<dt>${esc(q)}</dt><dd>${para(esc(a))}</dd>`).join("")}</dl>`);
}
function docSheet(kind, right, title, kv, body){
  return sheet(kind, right, `<p style="font-size:19px;font-weight:600;font-family:var(--sans);margin-bottom:10px">${esc(title)}</p>` +
    metaBlock(kv) + para(body));
}

  model:`"Because school staff routinely enter identifiable pupil detail — including EHCP status and pastoral content — into Intercom tickets, where Brightpath applies no retention limit and all eleven Customer Success staff can search the entire history, there is a risk that safeguarding-relevant personal data about children is held unlawfully and disclosed beyond those with a legitimate need, resulting in harm to a pupil, a notifiable personal data breach for the schools as controllers, and loss of trust that Brightpath cannot recover commercially."

      model:`Role: Brightpath is a data processor. The schools and trusts are the controllers of the pupil data. That is not a technicality, it decides who does what.

And Rob's aside about the tracking pixel: logged as a separate issue, not chased today.`,

Tom's "let's get ahead of it with the ICO" is wrong (not Brightpath's call, cuts across six controllers' assessments). Callum's "handle it quietly with the six schools" is wrong in a more serious way — and a learner who endorses concealment should be failed on integrity, not merely marked down.

      model:`Decision: notify all six schools today as controllers, under Article 33(2). Brightpath is the processor. We are not the ones who report to the ICO, and we should not pretend the choice is ours — but our notification is what starts each controller's Article 33(1) clock, so "without undue delay" means this afternoon, with what we have, not tomorrow with a tidier pack.

function normDim(d){ return DIM_MAP[d] || (DIMS[d] ? d : "judgement"); }

function wordCount(s){ return String(s||"").trim().split(/\s+/).filter(Boolean).length; }

function collectText(answers, fields){
  return fields.filter(f => f.kind === "textarea").map(f => answers[f.id] || "").join("\n\n");
}

function effortGate(answers, fields, scenarioId){
  const text = collectText(answers, fields);
  const words = wordCount(text);
  const asked = ASK_FOR_ANSWER.test(text);
  const empty = fields.filter(f => f.kind === "textarea").some(f => !String(answers[f.id]||"").trim());
  if (asked || words < 20 || (empty && words < 60)) {
    const pool = HINTS[scenarioId] || [
      "Go back to the artefact and read it line by line. The thing you are looking for is stated, not implied.",
      "Write down what you actually know, what you are assuming, and what you would have to ask. The middle list is usually the problem.",
      "Say what you would do, who does it, and by when. If you cannot name a date, you have not finished thinking."
    ];
    return {
      refused:true,
      reason: asked ? "You asked for the answer without attempting it. No."
        : (words === 0 ? "Nothing submitted." : "That is not an attempt — " + words + " words across the written fields."),
      hints: pool.slice(0, asked ? 1 : 2)
    };
  }
  return null;
}

function runChecks(checks, blob){
  const hits = [], misses = [], penalties = [];
  (checks||[]).forEach(c => {
    let hit = (c.any||[]).some(re => re.test(blob));
    if (c.penaltyAny && c.penaltyAny.some(re => re.test(blob))) { hit = false; penalties.push(c.label); }
    (hit ? hits : misses).push({ id:c.id, label:c.label, dim:normDim(c.dim), w:c.w||1 });
  });
  return { hits, misses, penalties };
}

function structuralChecks(spec, answers){
  const s = spec.scoring || {}, out = [];
  const add = (ok, dim, w, label, note) => out.push({ ok, dim, w, label, note });

  if (spec.type === "risk") {
    const L = parseInt(answers.likelihood,10), I = parseInt(answers.impact,10);
    if (L && I) {
      const sc = L*I, inBand = sc >= (s.bandMin||1) && sc <= (s.bandMax||25);
      add(inBand, "judgement", 2,
        inBand ? "Score of " + sc + " (" + L + "×" + I + ") lands in a defensible band"
               : "Score of " + sc + " (" + L + "×" + I + ") is outside any defensible band for these facts",
        inBand ? null : "On these facts a defensible score sits between " + (s.bandMin||1) + " and " + (s.bandMax||25) + ". Under-scoring a live exposure is how a register stops being believed.");
    } else add(false, "craft", 2, "Did not score the risk", "A risk without a score cannot be prioritised, and an unprioritised register is a list.");

    const o = answers.owner;
    if (!o || o === ALL_OWNERS[0]) add(false, "craft", 2, "No risk owner named", s.ownerNote);
    else if ((s.goodOwners||[]).includes(o)) add(true, "craft", 2, "Risk owner: " + o + " — right call");
    else if ((s.okOwners||[]).includes(o)) add(true, "craft", 1, "Risk owner: " + o + " — defensible, though not the obvious choice", s.ownerNote);
    else add(false, "craft", 2, "Risk owner: " + o + " — wrong", s.ownerNote);

    const t = answers.treatment;
    if (!t || t === "—") add(false, "judgement", 1, "No treatment selected");
    else if ((s.goodTreatment||[]).includes(t)) add(true, "judgement", 1, "Treatment: " + t + " — right");
    else add(false, "judgement", 2, "Treatment: " + t + " — not supportable at this score",
      "At a score above appetite, Retain is only available with a documented rationale and ELT sign-off, and Share does not move an obligation you hold as a processor.");
  }

  if (spec.type === "supplier") {
    const t = answers.tier;
    if (!t || t === "—") add(false, "craft", 1, "Supplier not tiered");
    else if ((s.goodTier||[]).includes(t)) add(true, "judgement", 2, "Tier: " + t + " — proportionate");
    else if ((s.badTier||[]).includes(t)) add(false, "judgement", 2, "Tier: " + t + " — out of proportion to what this supplier holds",
      "Tiering is how you decide how much assurance to demand. Get it wrong upwards and you burn the business's patience; get it wrong downwards and you under-assure a supplier that matters.");
    else add(true, "judgement", 1, "Tier: " + t + " — arguable");

    const d = answers.decision;
    if (!d) add(false, "judgement", 2, "No recommendation given", "A supplier assessment that does not end in a recommendation is a reading exercise.");
    else if ((s.goodDecision||[]).includes(d)) add(true, "judgement", 3, "Recommendation: " + d + " — defensible", s.decisionNote);
    else add(false, "judgement", 3, "Recommendation: " + d + " — not defensible here", s.decisionNote);
  }

  if (spec.type === "incidentBeat") {
    if (spec.sevOptions) {
      const v = answers.sev;
      if (!v || v === "—") add(false, "judgement", 2, "No severity assigned");
      else if ((s.goodSev||[]).includes(v)) add(true, "judgement", 2, "Severity " + v + " — right");
      else if ((s.okSev||[]).includes(v)) add(true, "judgement", 1, "Severity " + v + " — defensible", s.sevNote);
      else add(false, "judgement", 2, "Severity " + v + " — wrong on these facts", s.sevNote);
    }
    if (spec.hasDecision) {
      const d = answers.decision;
      if (!d) add(false, "judgement", 3, "No notification decision made", "Not deciding is a decision, and it is the one the clock punishes.");
      else if ((s.goodDecision||[]).includes(d)) add(true, "technical", 3, "Decision: " + d + " — correct", s.decisionNote);
      else if ((s.okDecision||[]).includes(d)) add(true, "technical", 1, "Decision: " + d + " — partially defensible", s.decisionNote);
      else add(false, "technical", 3, "Decision: " + d + " — wrong", s.decisionNote);
    }
  }
  return out;
}

function scoreFromRatio(r){
  if (r >= 0.999) return 5;   /* 5 requires every point, not most of them */
  if (r >= 0.84) return 4;
  if (r >= 0.64) return 3;
  if (r >= 0.42) return 2;
  if (r >= 0.20) return 1;
  return 0;
}

const FLABBY = [
  [/take (security|this|data protection) (very )?seriously/i, "\"We take security seriously\" is what people write when they have nothing to report."],
  [/abundance of caution/i, "\"Out of an abundance of caution\" is a phrase that has never once preceded a decision."],
  [/industry[- ]?(leading|standard|best) practice(?!.{0,40}(which|because|specifically|namely))/i, "\"Best practice\" with nothing after it is a claim with no content."],
  [/robust (process|measure|control|framework)/i, "\"Robust\" is not a control. Name the control."],
  [/going forward/i, "\"Going forward\" adds nothing that a date would not add better."]
];

function localGrade(spec, answers, ctx){
  const fields = spec.fields || [];
  const blob = collectText(answers, fields);
  const words = wordCount(blob);
  const { hits, misses, penalties } = runChecks(spec.checks, blob);
  const struct = structuralChecks(spec, answers);

  const tally = {}; DIM_ORDER.forEach(d => tally[d] = { got:0, tot:0 });
  hits.forEach(h => { tally[h.dim].got += h.w; tally[h.dim].tot += h.w; });
  misses.forEach(m => { tally[m.dim].tot += m.w; });
  struct.forEach(s => { const d = normDim(s.dim); tally[d].tot += s.w; if (s.ok) tally[d].got += s.w; });

  const overall = DIM_ORDER.reduce((a,d) => a + tally[d].got, 0) / Math.max(1, DIM_ORDER.reduce((a,d) => a + tally[d].tot, 0));
  const dims = {};
  DIM_ORDER.forEach(d => { dims[d] = tally[d].tot > 0 ? scoreFromRatio(tally[d].got / tally[d].tot) : scoreFromRatio(overall); });

  // communication is also judged as writing, not only as coverage
  const flab = FLABBY.filter(([re]) => re.test(blob));
  if (words < 60) dims.communication = Math.min(dims.communication, 2);
  else if (words < 110) dims.communication = Math.min(dims.communication, 3);
  if (words > 900) dims.communication = Math.max(0, dims.communication - 1);
  if (flab.length) dims.communication = Math.max(0, dims.communication - 1);
  if (penalties.length) dims.judgement = Math.max(0, dims.judgement - 1);

  const integrity = integrityScan(spec, answers, blob);
  if (integrity) { dims.judgement = 0; dims.craft = Math.min(dims.craft, 1); }

  const notes = struct.filter(s => s.note && !s.ok).map(s => s.note)
    .concat(flab.map(f => f[1]))
    .concat(penalties.map(p => "Marked down on: " + p));

  return {
    source:"local",
    dims,
    hits: hits.map(h => h.label).concat(struct.filter(s => s.ok).map(s => s.label)),
    misses: misses.map(m => m.label).concat(struct.filter(s => !s.ok).map(s => s.label)),
    notes,
    verdict: localVerdict(dims, integrity),
    coach: localCoach(dims, misses),
    npcLine: null,
    integrity,
    words
  };
}

function integrityScan(spec, answers, blob){
  for (const t of INTEGRITY_TRAPS) if (t.re.test(blob)) return { reason:"You proposed " + t.label + ".", severe:true };
  const cat = (spec.scoring && spec.scoring.catastrophic) || [];
  for (const c of cat) {
    if (c.needChip && answers.decision !== c.needChip) continue;
    if (!c.needChip && c.re && !c.re.test(blob)) continue;
    return { reason:c.label, severe:true };
  }
  return null;
}

function localVerdict(dims, integrity){
  if (integrity) return "Integrity failure. Everything else in this piece of work is irrelevant until that is dealt with.";
  const avg = DIM_ORDER.reduce((a,d)=>a+dims[d],0)/4;
  if (avg >= 4.5) return "Genuinely strong. This would survive an auditor reading it cold.";
  if (avg >= 3.5) return "Solid professional work with gaps you can close.";
  if (avg >= 2.5) return "Competent in parts. The thinking is there; the discipline is not yet.";
  if (avg >= 1.5) return "Below the line. You have described the situation rather than analysed it.";
  return "This does not do the job. Read the correct approach below and then read the artefact again.";
}

function localCoach(dims, misses){
  const weakest = DIM_ORDER.slice().sort((a,b) => dims[a]-dims[b])[0];
  const byDim = misses.filter(m => m.dim === weakest);
  const lead = {
    technical:"Watch this: technical accuracy. Anchor claims to a named article, clause or control and check the specific facts in front of you rather than the general shape of the problem.",
    judgement:"Watch this: judgement. The question is rarely 'is this bad' — it is 'how bad, compared with what else, and who decides'.",
    communication:"Watch this: communication. Write for the person who has to act on it, in the fewest words that still carry the meaning.",
    craft:"Watch this: professional craft. Owners, dates, evidence, root causes. The habits that make work auditable."
  }[weakest];
  return byDim.length ? lead + " Concretely, on this piece: " + byDim[0].label.replace(/^[A-Z]/, c=>c.toLowerCase()) + "." : lead;
}

/* ---------------- AI grading ---------------- */

const GRADER_RULES = `You are grading a trainee UK cyber GRC analyst's work inside a career simulator. You are their manager, not a quizmaster.

Grade four dimensions, each an integer 0-5:
- technical: is it right per the UK standard or law (ISO/IEC 27001:2022 with its 93 Annex A controls in 4 themes, UK GDPR, DPA 2018, ICO, Cyber Essentials)?
- judgement: proportionality, prioritisation, knowing when to escalate and when to decide.
- communication: clear, neutral, audience-appropriate. No jargon walls, no corporate filler.
- craft: evidence-thinking, root-cause discipline, named owners, realistic dates.

Calibration, and hold it: 0 nothing usable. 1 wrong or empty. 2 below the standard of a working analyst. 3 a competent professional job — this should feel earned, and is the most common good score. 4 notably strong. 5 rare, reserved for work you would send to a client or an auditor unchanged. Do not award 4 or 5 for effort, length or enthusiasm.

Rules:
- Never accept confident nonsense. If the answer is wrong, say so plainly and state the correct approach.
- If the substance is right but the expression is poor, pass the substance and coach the expression.
- Credit a defensible answer that differs from the model. Grade the defence, not the conformity.
- British spelling throughout. UK law and UK bodies only. If unsure of a specific factual detail, keep the learning point and avoid inventing citation-level specifics.
- Be specific. Quote or paraphrase what they actually wrote. Generic feedback is a failure of your job, not theirs.`;

function buildGradePrompt(spec, answers, ctx){
  const fieldDump = (spec.fields||[]).map(f => {
    const v = answers[f.id];
    return "### " + f.label + "\n" + (v && String(v).trim() ? v : "(left blank)");
  }).join("\n\n");
  return [
    GRADER_RULES,
    "\n---\nCOMPANY: " + ctx.company.name + " — " + ctx.company.blurb + "\nThe trainee plays " + ctx.playerName + ", " + ctx.company.role + ".\n" +
    "Risk scoring criteria in force: " + ctx.company.riskCriteria.scale + "\nRisk owner rule: " + ctx.company.riskCriteria.ownerRule,
    "\n---\nTASK: " + spec.title + "\n\nWHAT THIS TASK IS TESTING AND WHAT THE CORRECT ANSWER LOOKS LIKE (the trainee has not seen this):\n" + (spec.aiBrief||""),
    "\n---\nTHE TRAINEE'S SUBMISSION:\n\n" + fieldDump,
    "\n---\nReply with only a JSON object, no prose around it:\n" +
    '{"dims":{"technical":0,"judgement":0,"communication":0,"craft":0},' +
    '"verdict":"one or two sentences, direct, the headline judgement",' +
    '"gotRight":["specific things they actually did well, quoting their words where useful — [] if none"],' +
    '"missed":["specific things they got wrong or did not spot, each naming the correct position"],' +
    '"correction":"if anything is wrong, the correct approach in 2-5 sentences. Empty string if nothing is wrong.",' +
    '"coach":"one development point, phrased as \'Watch this: ...\'",' +
    '"integrityFlag":null,' +
    '"npcLine":"one line of feedback in character as ' + (ctx.npc ? ctx.npc.name + ", " + ctx.npc.role + " — " + ctx.npc.style : "their manager") + '"}\n\n' +
    'Set integrityFlag to a short string ONLY if the trainee proposed concealing a reportable matter, fabricating or backdating evidence, destroying records, or misleading an auditor, customer or regulator. Disagreeing with you is not an integrity failure.'
  ].join("\n");
}

async function aiGrade(spec, answers, ctx, signal){
  const sample = await getSample();
  if (!sample) return null;
  try {
    const r = await sample.json(buildGradePrompt(spec, answers, ctx), { modelTier:"complex", cache:false, signal });
    if (!r || !r.dims) return null;
    const dims = {};
    DIM_ORDER.forEach(d => { const n = Math.round(Number(r.dims[d])); dims[d] = Math.max(0, Math.min(5, isNaN(n) ? 0 : n)); });
    return {
      source:"ai", dims,
      hits: Array.isArray(r.gotRight) ? r.gotRight.map(String) : [],
      misses: Array.isArray(r.missed) ? r.missed.map(String) : [],
      notes: r.correction ? [String(r.correction)] : [],
      verdict: String(r.verdict || ""),
      coach: String(r.coach || ""),
      npcLine: r.npcLine ? String(r.npcLine) : null,
      integrity: r.integrityFlag ? { reason:String(r.integrityFlag), severe:true } : null
    };
  } catch (e) { return null; }
}

/* Deterministic facts always come from the local pass; the AI supplies the prose. */
async function gradeWork(spec, answers, ctx, signal){
  const gate = effortGate(answers, spec.fields||[], spec.scenarioId || spec.id);
  if (gate) return gate;

  const local = localGrade(spec, answers, ctx);
  const ai = await aiGrade(spec, answers, ctx, signal);
  if (!ai) return local;

  const struct = structuralChecks(spec, answers);
  const hardMisses = struct.filter(s => !s.ok);
  const merged = {
    source:"ai",
    dims: ai.dims,
    hits: ai.hits.concat(struct.filter(s => s.ok).map(s => s.label)),
    misses: ai.misses.concat(hardMisses.map(s => s.label)),
    notes: ai.notes.concat(hardMisses.filter(s => s.note).map(s => s.note)),
    verdict: ai.verdict || local.verdict,
    coach: ai.coach || local.coach,
    npcLine: ai.npcLine,
    integrity: ai.integrity || local.integrity,
    words: local.words
  };
  // the AI does not get to overrule an unambiguous structural error
  if (hardMisses.length) {
    const cap = 5 - Math.min(3, hardMisses.reduce((a,s)=>a+s.w,0));
    hardMisses.forEach(s => { const d = normDim(s.dim); merged.dims[d] = Math.min(merged.dims[d], Math.max(1, cap)); });
  }
  if (merged.integrity) { merged.dims.judgement = 0; merged.dims.craft = Math.min(merged.dims.craft, 1); }
  return merged;
}

/* ---------------- triage grading ---------------- */
function gradeTriage(signal){
  const plan = currentPlan();
  const ideal = plan.inbox.slice().sort((a,b) => a.trueRank - b.trueRank).map(i => i.id);
  const chosen = S.flow.order;
  const n = ideal.length;
  let displacement = 0;
  chosen.forEach((id, idx) => { displacement += Math.abs(ideal.indexOf(id) - idx); });
  const worst = Math.floor(n*n/2);
  const orderScore = Math.max(0, 1 - displacement / Math.max(1, worst));
  const topRight = chosen[0] === ideal[0];
  const topTwo = chosen.slice(0,2).filter(id => ideal.slice(0,2).includes(id)).length;

  const spec = {
    type:"triage", scenarioId:"triage-d" + plan.day, beatId:"-",
    title:"Morning triage", skill:"stake",
    fields:[{ id:"triageJustify", kind:"textarea", label:"Why that order" }],
    checks: plan.triageChecks, scoring:{},
    aiBrief:"The trainee ordered a morning inbox and justified it. The defensible order, with the reasoning behind each position:\n" +
      plan.inbox.slice().sort((a,b)=>a.trueRank-b.trueRank).map((i,idx) => (idx+1) + ". [" + i.src + "] " + i.from + " — " + i.subject + "\n   Why: " + i.why).join("\n") +
      "\nThey ordered it: " + chosen.map((id,idx) => (idx+1) + ". " + (plan.inbox.find(x=>x.id===id)||{}).subject).join(" | ") +
      "\nGrade the reasoning far more heavily than the exact sequence — several orders are defensible, but the justification must show they weighed consequence and decay rather than volume. Penalise an order driven by whoever shouted loudest."
  };
  const answers = { triageJustify: S.flow.triageJustify };
  const gate = effortGate(answers, spec.fields, spec.scenarioId);
  if (gate) return Promise.resolve(gate);

  const local = localGrade(spec, answers, ctxFor({from:"priya"}));
  // fold the ordering itself into judgement
  const ordPts = (orderScore * 3) + (topRight ? 1.5 : 0) + (topTwo === 2 ? 0.5 : 0);
  local.dims.judgement = Math.max(0, Math.min(5, Math.round((local.dims.judgement + Math.min(5, ordPts)) / 2)));
  local.orderScore = orderScore;
  local.ideal = ideal.map(id => plan.inbox.find(x => x.id === id));
  local.chosen = chosen;
  local.spec = spec;
  return aiGrade(spec, answers, ctxFor({from:"priya"}), signal).then(ai => {
    if (!ai) return local;
    ai.dims.judgement = Math.max(0, Math.min(5, Math.round((ai.dims.judgement * 2 + Math.min(5, ordPts)) / 3)));
    ai.orderScore = orderScore; ai.ideal = local.ideal; ai.chosen = chosen; ai.spec = spec;
    ai.words = local.words;
    return ai;
  });
}

function debriefFallback(){
  const rs = S.flow.results;
  const avg = d => rs.length ? rs.reduce((a,r)=>a+r.dims[d],0)/rs.length : 0;
  const best = DIM_ORDER.slice().sort((a,b)=>avg(b)-avg(a))[0];
  const worst = DIM_ORDER.slice().sort((a,b)=>avg(a)-avg(b))[0];
  const flagged = rs.filter(r => r.integrity);
  const lines = [];
  lines.push("Right. " + rs.length + (rs.length === 1 ? " piece" : " pieces") + " of work today. Let me do this in order.");
  rs.forEach(r => {
    const a = DIM_ORDER.reduce((x,d)=>x+r.dims[d],0)/4;
    lines.push("**" + r.title + "** — " + (a>=4?"strong":a>=3?"solid":a>=2?"patchy":"under the line") + ". " +
      (r.hits[0] ? "You got " + lower(r.hits[0]) + ". " : "") +
      (r.misses[0] ? "You did not get " + lower(r.misses[0]) + "." : "Nothing material missed."));
  });
  if (flagged.length) lines.push("And we need to talk about " + flagged[0].title + ". " + flagged[0].integrity.reason + " That is not a technical mistake, and it is the one thing I will not coach you through twice.");
  lines.push("Across the day your " + DIMS[best].toLowerCase() + " is carrying you and your " + DIMS[worst].toLowerCase() + " is not. " + localCoach({technical:avg("technical"),judgement:avg("judgement"),communication:avg("communication"),craft:avg("craft")}, []));
  return lines.join("\n\n");
}
function lower(s){ return String(s).replace(/^[A-Z]/, c => c.toLowerCase()); }

It is the end of ${S.player.name}'s working day — day ${S.day} of the quarter. ${plan.standing}

${dump}

Reply with the debrief text only.`;

          .map(([v,l]) => `<button class="navbtn" data-act="view" data-v="${v}" aria-current="${S.ui.view===v}">${l}</button>`).join("")}
      </div>
    </div>

    <div class="tiny muted" style="margin-top:auto;padding-top:10px">
      <span class="eyebrow">Save</span> <span id="saveStatus">${esc(saveStatus)}</span><br>
      <span class="eyebrow">AI</span> ${AI_STATE === "on" ? "manager grading live" : AI_STATE === "checking" ? "checking…" : "rubric grader (offline)"}
    </div>
  </aside>`;
}

/* ---------------- main router ---------------- */
function renderMain(){
  if (S.ui.view === "register") return viewRegister();
  if (S.ui.view === "company")  return viewCompany();
  if (S.ui.view === "record")   return viewRecord();
  if (S.ui.view === "save")     return viewSave();
  if (!S.flow) return viewOnboard();
  switch (S.flow.phase) {
    case "briefing":     return viewBriefing();
    case "triage":       return viewTriage();
    case "triageReview": return viewReview("triage");
    case "task":         return viewTask();
    case "taskReview":   return viewReview("task");
    case "debrief":      return viewDebrief();
    case "dayEnd":       return viewDayEnd();
    default:             return viewBriefing();
  }
}

/* ---------------- onboarding ---------------- */
function viewOnboard(){
  return `<div class="card pad stack">
    <div><span class="eyebrow">Phase 1 · Tier 1</span>
    <h1 style="font-size:30px;margin-top:6px">You start on Monday at Brightpath Learning.</h1></div>
    <p class="muted">Forty-five people in Shoreditch, eight million pounds of Series A, two hundred and ten schools trusting them with children's records, and an information security management system that currently consists of a Confluence page called <em>security stuff (old)</em>.</p>
    <p class="muted">A thirty-four school academy trust will sign a £1.4m contract the day Brightpath holds an ISO/IEC 27001 certificate. Nobody here has ever seen one. You are the first security hire, reporting to a vCISO who is in the building two days a week.</p>
    <hr class="rule">
    <label class="field"><span class="lb">Your name<span class="hint">this is who the NPCs will address</span></span>
      <input type="text" id="pname" data-field="pname" value="${esc(S.player.name)}" maxlength="42"></label>
    <div class="row"><button class="btn primary" data-act="begin">Start day one</button>

    <hr class="rule">
    ${howToPlay()}

}

function howToPlay(){
  return `<div class="stack">
    <div><span class="eyebrow">How to play</span></div>
    <div class="kv">
      <dt>The loop</dt><dd>Each session is one working day: a morning briefing and inbox, a graded triage call, two pieces of real work, then your manager's debrief.</dd>
      <dt>Triage</dt><dd>Put the inbox in the order you would actually work it and say why. The order matters less than the reasoning — and the most important thing in the list is rarely the loudest.</dd>
      <dt>The work</dt><dd>Every task hands you a real artefact: a thread, a returned questionnaire, a certificate, a live incident. Read it properly. Flaws are planted, never flagged — finding them is the exercise.</dd>
      <dt>Grading</dt><dd>Four dimensions, 0–5: technical accuracy, judgement, communication, professional craft. A 3 is a competent professional job. A 5 is rare. Asking for the answer without attempting it gets you a hint and nothing else.</dd>
      <dt>Integrity</dt><dd>One stat is not recoverable by being clever. Advising the company to conceal a reportable matter, fabricate evidence or mislead an auditor ends badly, immediately.</dd>
      <dt>Saving</dt><dd>Progress saves automatically where storage is available, and there is always an export/import you can paste somewhere safe.</dd>
    </div>
  </div>`;
}

/* ---------------- briefing ---------------- */
function viewBriefing(){
  const plan = currentPlan(), d = gameDate(S.tier, S.quarter, S.day);
  return `<div class="card pad stack">
      <div class="spread"><div><span class="eyebrow">Morning briefing · ${esc(fmtDate(d))}</span>
        <h1 style="font-size:26px;margin-top:6px">${esc(plan.headline)}</h1></div>
        <span class="pill info">Day ${S.day}</span></div>
      <p class="muted">${esc(plan.standing)}</p>
      <hr class="rule">
      <div class="kv">
        <dt>In flight</dt><dd>${BRIGHTPATH.drama}</dd>
        <dt>Your objectives</dt><dd>${BRIGHTPATH.objectives.map(o=>esc(o)).join("<br>")}</dd>
      </div>
    </div>
    <div class="card pad stack">
      <div><span class="eyebrow">First graded act of the day</span>
      <h2 style="font-size:19px;margin-top:5px">Open the inbox and decide what you are doing first.</h2></div>
      <p class="muted tiny">There are ${plan.inbox.length} items. At least two of them are competing for the same hour, and at least one is quieter than it deserves to be.</p>
      <div class="row"><button class="btn primary" data-act="toTriage">Open the inbox</button></div>
    </div>`;
}

/* ---------------- triage ---------------- */
function viewTriage(){
  const plan = currentPlan(), order = S.flow.order;
  const items = plan.inbox.map(i => {
    const pos = order.indexOf(i.id);
    return `<div class="item ${pos>=0?"picked":""}">
      <div class="ord">${pos>=0?pos+1:"·"}</div>
      <div><div class="src">${esc(i.src)} · ${esc(i.from)}</div>
        <div class="sj">${esc(i.subject)}</div>
        <div class="pv">${esc(i.preview)}</div></div>
      <button class="btn small pick" data-act="pick" data-id="${i.id}">${pos>=0?"Undo":"Next"}</button>
    </div>`;
  }).join("");
  const done = order.length === plan.inbox.length;
  return `<div class="card pad stack">
      <div class="spread"><div><span class="eyebrow">Triage · graded</span>
        <h1 style="font-size:23px;margin-top:5px">Order the inbox</h1></div>
        <span class="pill ${done?"good":""}">${order.length}/${plan.inbox.length} placed</span></div>
      <p class="muted tiny">Click <strong>Next</strong> on the item you would work first, then the second, and so on. You can undo the most recent placement at any time.</p>
    </div>
    <div class="inbox">${items}</div>
    <div class="card pad stack">
      <label class="field"><span class="lb">Why that order<span class="hint">Priya will read this. Three or four sentences.</span></span>
        <textarea id="triageJustify" data-field="triageJustify" rows="6" placeholder="What did you weigh? What are you consciously letting slip, and what happens if the day goes wrong?">${esc(S.flow.triageJustify)}</textarea></label>
      ${busyRow("Priya is reading your triage")}
      <div class="row"><button class="btn primary" data-act="submitTriage" ${done&&!BUSY?"":"disabled"}>Submit triage</button>
        ${!done?`<span class="tiny muted">Place every item first.</span>`:""}</div>
    </div>`;
}

function busyRow(label){
  if (!BUSY) return "";
  return `<div class="callout"><span class="thinking"><span class="spin"></span>${esc(BUSY.label||label)}</span>
    <div class="row" style="margin-top:9px"><button class="btn small" data-act="skipAi">Skip the wait — grade with the built-in rubric</button></div></div>`;
}

/* ---------------- task ---------------- */
function viewTask(){
  const spec = specForCurrent();
  if (!spec) return viewDebriefGate();
  const sc = currentScenario();
  const npc = BRIGHTPATH.people[spec.from];
  const beats = sc.type === "incident" ? sc.beats.length : 1;
  return `<div class="card pad stack">
      <div class="spread">
        <div><span class="eyebrow">Task ${S.flow.taskIdx+1} of ${currentPlan().tasks.length} · ${esc(typeLabel(sc.type))}</span>
          <h1 style="font-size:23px;margin-top:5px">${esc(spec.title)}</h1></div>
        <div style="text-align:right">
          <span class="pill">${esc(SKILLS[spec.skill])}</span>
          ${beats>1?`<div class="step" style="margin-top:6px">Beat <b>${S.flow.beatIdx+1}</b> of ${beats} · ${esc(spec.clock||"")}</div>`:""}
        </div>
      </div>
      <p class="muted">${esc(spec.brief)}</p>
      ${npc?`<p class="tiny muted">From ${esc(npc.name)}, ${esc(npc.role)}.</p>`:""}
    </div>
    ${spec.render()}
    <div class="card pad stack">
      <div><span class="eyebrow">Your work</span></div>
      ${spec.fields.map(f => renderField(spec, f)).join("")}
      ${spec.type === "risk" ? riskCriteriaPanel() : ""}
      ${spec.type === "incidentBeat" && spec.sevOptions ? sevPanel() : ""}
      ${busyRow("Your work is being marked")}
      <div class="row"><button class="btn primary" data-act="submitTask" ${BUSY?"disabled":""}>Submit</button>
        <button class="btn ghost" data-act="hint">I'm stuck — one hint <span class="tiny muted">(caps this task at 4)</span></button></div>
      ${S.flow.hintShown ? `<div class="callout amberc"><span class="ch">Hint</span>${esc(S.flow.hintShown)}</div>` : ""}
    </div>`;
}

function typeLabel(t){ return { risk:"Risk write-up", supplier:"Supplier assessment", incident:"Incident decision" }[t] || t; }

function renderField(spec, f){
  const v = getAnswer(spec, f.id) || "";
  const id = "f_" + spec.scenarioId + "_" + spec.beatId + "_" + f.id;
  const lb = `<span class="lb">${esc(f.label)}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</span>`;
  if (f.kind === "textarea")
    return `<label class="field">${lb}<textarea id="${id}" data-field="ans" data-fid="${f.id}" rows="${f.rows||5}" placeholder="${esc(f.placeholder||"")}">${esc(v)}</textarea></label>`;
  if (f.kind === "select")
    return `<label class="field">${lb}<select id="${id}" data-field="ans" data-fid="${f.id}">${
      f.options.map(o => `<option${o===v?" selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
  if (f.kind === "chips")
    return `<div class="field">${lb}<div class="chips">${
      f.options.map(o => `<button class="chip" data-act="chip" data-fid="${f.id}" data-v="${esc(o)}" aria-pressed="${o===v}">${esc(o)}</button>`).join("")}</div></div>`;
  return `<label class="field">${lb}<input type="text" id="${id}" data-field="ans" data-fid="${f.id}" value="${esc(v)}"></label>`;
}

function riskCriteriaPanel(){
  return `<div class="callout"><span class="ch">Brightpath risk criteria</span>
    <p>${esc(BRIGHTPATH.riskCriteria.scale)}</p>
    ${BRIGHTPATH.riskCriteria.appetite.map(([b,t])=>`<p><strong class="mono">${esc(b)}</strong> — ${esc(t)}</p>`).join("")}
    <p>${esc(BRIGHTPATH.riskCriteria.ownerRule)}</p></div>`;
}
function sevPanel(){
  return `<div class="callout"><span class="ch">Brightpath severity scale</span>
    ${SEV_SCALE.map(([k,t])=>`<p><strong class="mono">${esc(k)}</strong> — ${esc(t)}</p>`).join("")}</div>`;
}

/* ---------------- review ---------------- */
function viewReview(kind){
  const r = LAST_RESULT;
  if (!r) return `<div class="card pad">Nothing to show. <button class="btn" data-act="resume">Continue</button></div>`;
  if (r.refused) return `<div class="card pad stack">
      <div><span class="eyebrow">Not graded</span><h1 style="font-size:22px;margin-top:5px">${esc(r.reason)}</h1></div>
      <p class="muted">I am not giving you the answer. Here is where to look.</p>
      ${r.hints.map(h=>`<div class="callout amberc"><span class="ch">Hint</span>${esc(h)}</div>`).join("")}
      <div class="row"><button class="btn primary" data-act="backToWork">Go back and do it properly</button></div>
    </div>`;

  const avg = DIM_ORDER.reduce((a,d)=>a+r.dims[d],0)/4;
  const npc = r.npcFrom ? BRIGHTPATH.people[r.npcFrom] : BRIGHTPATH.people.priya;
  return `<div class="review ${r.integrity?"flagged":""}">
      <div class="pad" style="padding-bottom:14px">
        <div class="spread"><div><span class="eyebrow">${kind==="triage"?"Triage review":"Marked"} · ${esc(r.title||"")}</span>
          <h1 style="font-size:21px;margin-top:5px;max-width:34ch">${esc(r.verdict)}</h1></div>
          <div style="text-align:right"><div class="eyebrow">Average</div>
            <div style="font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1">${avg.toFixed(2)}</div>
            <div class="tiny muted">+${r.gained||0} XP</div></div></div>
      </div>
      <div class="dims">${DIM_ORDER.map(d => {
        const v = r.dims[d], cls = v<=1?"low":v<=2?"mid":"";
        return `<div class="dim"><div class="dn">${esc(DIMS[d])}</div><div class="dv">${v}<small>/5</small></div>
          <div class="dots ${cls}">${[0,1,2,3,4].map(i=>`<i class="${i<v?"on":""}"></i>`).join("")}</div></div>`;
      }).join("")}</div>
      <div class="pad stack">
        ${r.integrity ? `<div class="callout red"><span class="ch">Integrity</span>${esc(r.integrity.reason)} Judgement scored zero and your integrity rating has taken a permanent hit. There is no version of this job where that is a shortcut.</div>` : ""}
        ${npc && r.npcLine ? `<div><span class="eyebrow">${esc(npc.name)}</span><p class="npcline" style="margin-top:5px">“${esc(r.npcLine)}”</p></div>` : ""}
        ${r.hits.length ? `<div><span class="eyebrow">What you got</span><ul class="fb-list" style="margin-top:7px">${
          r.hits.map(h=>`<li class="hit"><span class="mk">✓</span><span>${esc(h)}</span></li>`).join("")}</ul></div>` : ""}
        ${r.misses.length ? `<div><span class="eyebrow">What you missed</span><ul class="fb-list" style="margin-top:7px">${
          r.misses.map(h=>`<li class="miss"><span class="mk">✕</span><span>${esc(h)}</span></li>`).join("")}</ul></div>` : ""}
        ${r.notes && r.notes.length ? r.notes.map(n=>`<div class="callout"><span class="ch">Correction</span>${esc(n)}</div>`).join("") : ""}
        ${r.coach ? `<div class="callout amberc"><span class="ch">Development point</span>${esc(r.coach)}</div>` : ""}
        ${kind==="triage" ? triageOrderPanel(r) : ""}
        ${r.model ? `<details><summary style="cursor:pointer;font-size:13px;font-weight:600;padding:6px 0">Show the approach I was looking for</summary>
          <div class="sheet" style="margin-top:9px"><div class="sheet-bd">${para(esc(r.model))}</div></div></details>` : ""}
        <div class="row"><button class="btn primary" data-act="continue">${esc(r.nextLabel||"Continue")}</button>
          <span class="tiny muted">${r.source==="ai"?"Graded by your manager.":"Graded against the built-in rubric."}</span></div>
      </div>
    </div>`;
}

function triageOrderPanel(r){
  if (!r.ideal) return "";
  return `<div><span class="eyebrow">A defensible order, and why</span>
    <div class="inbox" style="margin-top:8px">${r.ideal.map((i,idx) => {
      const yours = r.chosen.indexOf(i.id) + 1;
      const delta = Math.abs(yours - (idx+1));
      return `<div class="item"><div class="ord" style="border-style:solid">${idx+1}</div>
        <div><div class="src">${esc(i.src)} · ${esc(i.from)}</div><div class="sj">${esc(i.subject)}</div>
        <div class="pv">${esc(i.why)}</div></div>
        <span class="pill ${delta===0?"good":delta<=1?"":"warn"}">you: ${yours}</span></div>`;
    }).join("")}</div>
    <p class="tiny muted" style="margin-top:8px">Several orders are defensible. This one is not the only right answer — it is the one whose reasoning holds up.</p></div>`;
}

/* ---------------- debrief ---------------- */
function viewDebriefGate(){
  return `<div class="card pad stack"><p>All work complete.</p>
    <button class="btn primary" data-act="toDebrief">End of day</button></div>`;
}
function viewDebrief(){
  const dbf = S.flow.debrief;
  const p = BRIGHTPATH.people.priya;

  const avg = d => rs.length ? (rs.reduce((a,x)=>a+x.dims[d],0)/rs.length) : 0;
  return `<div class="card pad stack">
      <div><span class="eyebrow">End of day · debrief</span>
        <h1 style="font-size:23px;margin-top:5px">${esc(p.name)} catches you on the way out</h1></div>
      ${dbf ? `<div class="sheet"><div class="sheet-bd npcline" style="font-style:normal">${para(esc(dbf.text).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"))}</div></div>`

      <hr class="rule">
      <div><span class="eyebrow">Today's average by dimension</span>
        <div class="scoregrid" style="margin-top:9px">${DIM_ORDER.map(d=>`<div class="sbox">
          <div class="eyebrow" style="font-size:9.5px">${esc(DIMS[d])}</div>
          <div class="n">${avg(d).toFixed(1)}</div></div>`).join("")}</div></div>
      ${dbf ? `<div class="row"><button class="btn primary" data-act="closeDay">Go home</button></div>` : ""}

}

function viewDayEnd(){
  const nextDay = S.day + 1;
  const weekDone = S.day >= DAY_PLANS.length;
  return `<div class="card pad stack">
      <div><span class="eyebrow">Day ${S.day} complete</span>
        <h1 style="font-size:25px;margin-top:5px">${weekDone ? "That is the working week." : "Same time tomorrow."}</h1></div>
      ${weekDone ? `<p class="muted">You have worked through every scenario Phase 1 ships with: two risk write-ups you had to argue for, three supplier assessments including one that was a trap in the opposite direction, and two incidents with genuinely different right answers.</p>
        <p class="muted">Quarterly performance review, the recruiter, the interview mini-game, the remaining eleven task types, random events and Harland &amp; Moore Logistics all arrive in Phase 2. Say <strong>next phase</strong> and your save comes with you.</p>` : ""}
      <div><span class="eyebrow">Where you stand</span>
        <div class="scoregrid" style="margin-top:9px">
          <div class="sbox"><div class="eyebrow" style="font-size:9.5px">Total XP</div><div class="n">${S.xp}</div></div>
          <div class="sbox"><div class="eyebrow" style="font-size:9.5px">Integrity</div><div class="n">${S.integrity}%</div></div>
          <div class="sbox"><div class="eyebrow" style="font-size:9.5px">Pieces of work</div><div class="n">${S.cv.length}</div></div>
          <div class="sbox"><div class="eyebrow" style="font-size:9.5px">Weakest</div><div class="n" style="font-size:15px;padding-top:4px">${esc(DIMS[weakestDims()[0]||"technical"])}</div></div>
        </div></div>
      <div class="row">
        ${weekDone ? `<button class="btn" data-act="nextDay">Work the week again (same scenarios)</button>`
                   : `<button class="btn primary" data-act="nextDay">Start day ${nextDay}</button>`}
        <button class="btn ghost" data-act="view" data-v="record">See my record</button>
      </div>
    </div>`;

/* ---------------- side views ---------------- */

    ${rows.length ? tableSheet("Work completed", S.cv.length + " pieces", "", ["Day","Task","Skill branch","T/J/C/C","Avg"], rows)

    <div class="card pad stack"><div><span class="eyebrow">Skill branches</span></div>
      ${SKILL_ORDER.map(k => { const lv = skillLevel(skillXp(k));

}

function viewSave(){
  return `<div class="card pad stack">
      <div><span class="eyebrow">Save & settings</span><h1 style="font-size:23px;margin-top:5px">Your career, as text</h1></div>
      <p class="muted tiny">Status: <strong>${esc(saveStatus)}</strong>. Progress is written automatically at the end of every graded piece of work. Copy the export somewhere safe if you want a career you cannot lose.</p>
      <label class="field"><span class="lb">Export<span class="hint">select all and copy</span></span>
        <textarea id="exportBox" rows="6" readonly>${esc(serialise())}</textarea></label>
      <div class="row"><button class="btn" data-act="copySave">Copy export</button><button class="btn" data-act="saveNow">Save now</button></div>
      <hr class="rule">
      <label class="field"><span class="lb">Import<span class="hint">paste a save and load it — this replaces the career you are in</span></span>
        <textarea id="importBox" rows="5" placeholder='{"v":3,...}'></textarea></label>
      <div class="row"><button class="btn" data-act="importSave">Load that save</button></div>
      <div id="importMsg" class="tiny muted"></div>
      <hr class="rule">
      <div class="row"><button class="btn" data-act="hardReset">Start a new career</button>
        <span class="tiny muted">Wipes this save. There is no undo.</span></div>
    </div>`;
}
/* ============================================================
   Controller and boot
   ============================================================ */

function startBusy(label){ BUSY = { label, ctl: new AbortController() }; render(); return BUSY.ctl.signal; }
function endBusy(){ BUSY = null; }

async function doSubmitTriage(){
  const signal = startBusy("Priya is reading your triage");
  let r;
  try { r = await gradeTriage(signal); } catch(e){ r = null; }
  endBusy();
  if (!r) { render(); return; }
  if (r.refused) { LAST_RESULT = r; S.flow.phase = "triageReview"; render(); return; }
  const spec = { skill:"stake", secondary:null, title:"Morning triage", scenarioId:r.spec.scenarioId, id:r.spec.scenarioId };
  r.gained = award(spec, r);
  recordCv(spec, r);
  r.title = "Morning triage";
  r.npcFrom = "priya";
  r.nextLabel = "Start work";
  S.flow.triageResult = { dims:r.dims, gained:r.gained };
  S.flow.results.push({ taskId:"triage", title:"Morning triage", dims:r.dims, hits:r.hits, misses:r.misses, integrity:r.integrity });
  LAST_RESULT = r;
  S.flow.phase = "triageReview";
  render();
  saveGame();
}

async function doSubmitTask(){
  const spec = specForCurrent();
  if (!spec) return;
  const signal = startBusy("Your work is being marked");
  let r;
  try { r = await gradeWork(spec, answersFor(spec), ctxFor(spec), signal); } catch(e){ r = null; }
  endBusy();
  if (!r) { render(); return; }
  if (r.refused) { LAST_RESULT = r; S.flow.phase = "taskReview"; render(); return; }

  if (S.flow.hintPenalty) {
    r.dims.technical = Math.min(r.dims.technical, 4);
    r.dims.judgement = Math.min(r.dims.judgement, 4);
    r.notes = (r.notes||[]).concat(["You took a hint on this one, so technical accuracy and judgement are capped at 4. Worth it if it taught you something; expensive if it was impatience."]);
  }
  r.gained = award(spec, r);
  recordCv(spec, r);
  r.title = spec.title;
  r.model = spec.model;
  r.npcFrom = spec.from;
  const sc = currentScenario();
  const moreBeats = sc.type === "incident" && S.flow.beatIdx < sc.beats.length - 1;
  const moreTasks = S.flow.taskIdx < currentPlan().tasks.length - 1;
  r.nextLabel = moreBeats ? "Next beat" : moreTasks ? "Next task" : "End of day";
  S.flow.results.push({ taskId:spec.scenarioId, title:spec.title, dims:r.dims, hits:r.hits, misses:r.misses, integrity:r.integrity });
  if (!moreBeats && S.seen.indexOf(spec.scenarioId) < 0) S.seen.push(spec.scenarioId);
  S.flow.hintShown = null; S.flow.hintPenalty = false;
  LAST_RESULT = r;
  S.flow.phase = "taskReview";
  render();
  saveGame();
}

function advance(){
  const sc = currentScenario();
  const moreBeats = sc && sc.type === "incident" && S.flow.beatIdx < sc.beats.length - 1;
  if (moreBeats) { S.flow.beatIdx++; S.flow.hintShown = null; S.flow.hintCount = 0; S.flow.phase = "task"; LAST_RESULT = null; render(); return; }
  S.flow.beatIdx = 0; S.flow.hintShown = null; S.flow.hintCount = 0;
  if (S.flow.taskIdx < currentPlan().tasks.length - 1) {
    S.flow.taskIdx++; S.flow.phase = "task"; LAST_RESULT = null; render(); return;
  }
  toDebrief();
}

async function toDebrief(){
  S.flow.phase = "debrief"; LAST_RESULT = null; render();
  const d = await buildDebrief();
  S.flow.debrief = d;
  S.dayLog.push({ day:S.day, quarter:S.quarter, results:S.flow.results.map(r=>({title:r.title,dims:r.dims})), debrief:d.text });
  render();
  saveGame();
}

function showHint(){
  const spec = specForCurrent();
  const pool = HINTS[spec.scenarioId] || ["Read the artefact again, line by line. What is stated there that you have not accounted for?"];
  const used = S.flow.hintCount || 0;
  S.flow.hintShown = pool[Math.min(used, pool.length-1)];
  S.flow.hintCount = used + 1;
  S.flow.hintPenalty = true;
  render();
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;

  if (act === "view") { S.ui.view = b.dataset.v; render(); return; }
  if (act === "begin") {
    const n = (document.getElementById("pname")||{}).value;
    S.player.name = (n && n.trim()) || "Alex Osei";
    startDay(); S.ui.view = "day"; render(); saveGame(); return;
  }
  if (act === "toTriage") { S.flow.phase = "triage"; render(); return; }
  if (act === "pick") {
    const id = b.dataset.id, i = S.flow.order.indexOf(id);
    if (i >= 0) S.flow.order.splice(i, 1); else S.flow.order.push(id);
    render(); return;
  }
  if (act === "submitTriage") { doSubmitTriage(); return; }
  if (act === "submitTask")   { doSubmitTask(); return; }
  if (act === "skipAi")       { if (BUSY) BUSY.ctl.abort(); return; }
  if (act === "hint")         { showHint(); return; }
  if (act === "chip") {
    const spec = specForCurrent();
    setAnswer(spec, b.dataset.fid, getAnswer(spec, b.dataset.fid) === b.dataset.v ? "" : b.dataset.v);
    render(); return;
  }
  if (act === "backToWork") { LAST_RESULT = null; S.flow.phase = S.flow.triageResult ? "task" : "triage"; render(); return; }
  if (act === "continue")   { if (S.flow.phase === "triageReview") { S.flow.phase = "task"; LAST_RESULT = null; render(); } else advance(); return; }
  if (act === "resume")     { S.ui.view = "day"; render(); return; }
  if (act === "toDebrief")  { toDebrief(); return; }
  if (act === "closeDay")   { S.flow.phase = "dayEnd"; render(); saveGame(); return; }
  if (act === "nextDay")    { S.day += 1; startDay(); S.ui.view = "day"; render(); saveGame(); return; }

  if (act === "saveNow")  { saveGame(); return; }
  if (act === "copySave") {
    const t = document.getElementById("exportBox");
    t.select(); try { document.execCommand("copy"); b.textContent = "Copied"; setTimeout(()=>{b.textContent="Copy export";},1600); } catch(err){}
    return;
  }
  if (act === "importSave") {
    const raw = (document.getElementById("importBox")||{}).value || "";
    const msg = document.getElementById("importMsg");
    try {
      const p = JSON.parse(raw);
      if (!p || !p.player) throw new Error("that is not a GRC Grind save");
      if (p.v !== GAME.save) throw new Error("that save is from a different version of the game (v" + p.v + ", this is v" + GAME.save + ")");
      S = migrate(p); S.ui.view = "day";
      if (!S.flow) startDay();
      render(); saveGame();
    } catch(err){ if (msg) msg.textContent = "Could not load that save — " + err.message + "."; }
    return;
  }
  if (act === "hardReset") {
    if (b.dataset.armed) {
      S = newGame(); try { localStorage.removeItem(LS_KEY); } catch(e){}
      getDB().then(db => { if (db) db.doc("saves/career").delete().catch(()=>{}); });
      render(); return;
    }
    b.dataset.armed = "1"; b.textContent = "Really? This deletes everything."; b.classList.add("primary");
    return;
  }
});

document.addEventListener("input", e => {
  const f = e.target.dataset ? e.target.dataset.field : null;
  if (!f) return;
  if (f === "pname") { S.player.name = e.target.value; return; }
  if (f === "triageJustify") { S.flow.triageJustify = e.target.value; return; }
  if (f === "ans") { setAnswer(specForCurrent(), e.target.dataset.fid, e.target.value); return; }
});
document.addEventListener("change", e => {
  const f = e.target.dataset ? e.target.dataset.field : null;
  if (f === "ans") setAnswer(specForCurrent(), e.target.dataset.fid, e.target.value);
});

/* ---------------- boot ---------------- */
async function start(hot){
  await loadGame();
  if (hot && hot.S) { try { S = migrate(hot.S); } catch(e){} }
  if (!S.flow && (S.cv.length > 0 || S.day > 1)) startDay();
  render();
  const s = await getSample();
  AI_STATE = s ? "on" : "off";
  render();
}

if (window.claude && window.claude.hot) {
  try { window.claude.hot.snapshot(() => ({ S: JSON.parse(serialise()) })); } catch(e){}
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start(window.claude && window.claude.hot ? window.claude.hot.data : null);
</script>
