<title>GRC Grind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDF0EE; --surface:#FFFFFF; --surface-2:#F4F7F5; --paper:#FBFAF7;
  --ink:#141B19; --ink-2:#4E5C57; --ink-3:#7C8A85;
  --line:#D2DAD6; --line-2:#B7C3BE;
  --accent:#0E5A47; --accent-ink:#0E5A47; --accent-soft:#DAE8E2;
  --stamp:#A02B24; --stamp-ink:#A02B24; --stamp-soft:#F4DFDD;
  --amber:#8E6210; --amber-soft:#F3E6C9;
  --sky:#1E5E7C; --sky-soft:#DBE8EE;
  --shadow:0 1px 2px rgba(20,27,25,.05), 0 10px 26px -16px rgba(20,27,25,.35);
  --shadow-lift:0 2px 4px rgba(20,27,25,.06), 0 18px 40px -20px rgba(20,27,25,.42);
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0F1513; --surface:#17201D; --surface-2:#1D2724; --paper:#1A2320;
  --ink:#E7EEEA; --ink-2:#A2B1AB; --ink-3:#76847E;
  --line:#293733; --line-2:#3A4A45;
  --accent:#54C4A2; --accent-ink:#7BD6BA; --accent-soft:#16352D;
  --stamp:#E8877F; --stamp-ink:#F0A29B; --stamp-soft:#38201E;
  --amber:#D9AC58; --amber-soft:#382D16;
  --sky:#84BCD6; --sky-soft:#152F3B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0F1513; --surface:#17201D; --surface-2:#1D2724; --paper:#1A2320;
  --ink:#E7EEEA; --ink-2:#A2B1AB; --ink-3:#76847E;
  --line:#293733; --line-2:#3A4A45;
  --accent:#54C4A2; --accent-ink:#7BD6BA; --accent-soft:#16352D;
  --stamp:#E8877F; --stamp-ink:#F0A29B; --stamp-soft:#38201E;
  --amber:#D9AC58; --amber-soft:#382D16;
  --sky:#84BCD6; --sky-soft:#152F3B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-0.01em}
p{margin:0 0 .75em}
p:last-child{margin-bottom:0}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:266px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow-y:auto}
.main{min-width:0;padding:22px 24px 72px;display:flex;flex-direction:column;gap:18px}
.main-inner{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (max-width:880px){
  .rail-deep{display:none}
  .app{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .main{padding:18px 16px 64px}
}

/* ---------- rail bits ---------- */
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em}
.railcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:11px 12px}
.railcard .k{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:3px}
.railcard .v{font-size:14px;font-weight:600;line-height:1.3}
.railcard .sub{font-size:12px;color:var(--ink-2);margin-top:3px}
.railhead{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.skillrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:4px 0;font-size:12.5px}
.skillrow .nm{color:var(--ink-2)}
.skillrow .lv{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase}
.bar{grid-column:1/-1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.navlist{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:var(--r);cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px 20px}
@media (max-width:880px){.pad{padding:15px 16px}}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.rule{height:1px;background:var(--line);border:0;margin:0}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}
.mono{font-family:var(--mono)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:9px 15px;border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:500;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#07130F}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.btn.small{padding:6px 11px;font-size:12.5px}

.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.pill.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.pill.bad{background:var(--stamp-soft);border-color:transparent;color:var(--stamp-ink)}
.pill.info{background:var(--sky-soft);border-color:transparent;color:var(--sky)}

textarea,input[type=text],select{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 11px;resize:vertical}
textarea{min-height:110px;line-height:1.55}
textarea::placeholder{color:var(--ink-3)}
label.field{display:block}
label.field>.lb{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13px;font-weight:600;margin-bottom:5px}
label.field>.lb .hint{font-weight:400;font-size:12px;color:var(--ink-3)}
.coachline{font-size:12.5px;line-height:1.5;color:var(--ink-2);background:var(--accent-soft);border-left:2px solid var(--accent);padding:8px 11px;border-radius:0 var(--r) var(--r) 0;margin:0 0 7px}
.coachline strong{color:var(--ink)}
details.callout summary::marker{color:var(--ink-3)}
details.callout[open] summary{border-bottom:1px solid var(--line)}

/* ---------- in-fiction artefact sheets ---------- */
.sheet{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.sheet-hd{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.sheet-hd .t{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sheet-bd{padding:15px 17px;font-family:var(--serif);font-size:16px;line-height:1.62}
@media (max-width:880px){.sheet-bd{padding:13px 14px;font-size:15.5px}}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-family:var(--sans);font-size:12.5px;padding-bottom:10px;margin-bottom:11px;border-bottom:1px solid var(--line)}
.meta dt{color:var(--ink-3);font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding-top:2px}
.meta dd{margin:0;color:var(--ink)}
.msg + .msg{margin-top:13px;padding-top:13px;border-top:1px dashed var(--line-2)}
.msg .who{font-family:var(--sans);font-size:12.5px;font-weight:600;margin-bottom:2px}
.msg .when{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:6px}
.quoted{border-left:2px solid var(--line-2);padding-left:11px;color:var(--ink-2);font-style:italic}
.sheet table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13px;font-variant-numeric:tabular-nums}
.sheet table th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:6px 9px;border-bottom:1px solid var(--line-2)}
.sheet table td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
.sheet table tr:last-child td{border-bottom:0}
.scroller{overflow-x:auto}
.qa{margin:0}
.qa dt{font-family:var(--sans);font-size:13px;font-weight:600;margin-top:11px}
.qa dt:first-child{margin-top:0}
.qa dd{margin:3px 0 0;padding-left:13px;border-left:2px solid var(--accent-soft)}

/* ---------- triage ---------- */
.inbox{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.item .ord{width:29px;height:29px;flex:none;border-radius:999px;border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink-3)}
.item.picked .ord{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.item .src{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.item .sj{font-weight:600;font-size:14px;line-height:1.35;margin:1px 0 2px}
.item .pv{font-size:12.5px;color:var(--ink-2)}
.item button.pick{align-self:center}

/* ---------- grading ---------- */
.review{border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:var(--r);background:var(--surface);overflow:hidden}
.review.flagged{border-left-color:var(--stamp)}
.dims{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
@media (max-width:620px){.dims{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dim{background:var(--surface-2);padding:10px 12px}
.dim .dn{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.dim .dv{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:1px}
.dim .dv small{font-size:12px;font-weight:500;color:var(--ink-3)}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:100%;height:3px;border-radius:2px;background:var(--line-2)}
.dots i.on{background:var(--accent)}
.dots.low i.on{background:var(--stamp)}
.dots.mid i.on{background:var(--amber)}
.fb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fb-list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.5}
.fb-list li .mk{font-family:var(--mono);font-size:11px;font-weight:600;line-height:1.55}
.fb-list li.hit .mk{color:var(--accent-ink)}
.fb-list li.miss .mk{color:var(--stamp-ink)}
.npcline{font-family:var(--serif);font-size:16.5px;line-height:1.6;font-style:italic;color:var(--ink)}
.callout{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:12px 14px;font-size:13.5px;line-height:1.55}
.callout.red{background:var(--stamp-soft);border-color:transparent}
.callout.amberc{background:var(--amber-soft);border-color:transparent}
.callout .ch{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.callout.red .ch{color:var(--stamp-ink)}

/* ---------- misc ---------- */
.beatnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.step{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:3px 0}
.step b{color:var(--ink)}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13.5px}
.spin{width:12px;height:12px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(15,21,19,.55);display:grid;place-items:center;padding:18px;z-index:50;overflow-y:auto}
.modal .card{max-width:640px;width:100%;max-height:calc(100vh - 36px);overflow-y:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.kv dd{margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#07130F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#07130F}}
.scoregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.sbox{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2)}
.sbox .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.hidden{display:none!important}
</style>
